# ---------------------------------------------------------------
# 加到宝塔站点配置里（网站 → 你的站点 → 设置 → 配置文件）
#
# 位置：放进 server { ... } 大括号内部，和已有的 location / 同级。
# 改完保存，Nginx 会自动重载（或手动重启）。
#
# 作用：把 /dl/xxx 转发给本机的签名服务，服务返回 302 跳转到 OSS 签名地址。
#       大文件下载流量不经过本机，只多一次几百字节的 302 响应。
# ---------------------------------------------------------------

location /dl/ {
    proxy_pass http://127.0.0.1:5099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_buffering off;
    proxy_redirect off;
}

# 可选：如果希望签名服务本身不被外部直接访问（它默认只监听 127.0.0.1，已经安全）
# 这里不需要额外限制。
